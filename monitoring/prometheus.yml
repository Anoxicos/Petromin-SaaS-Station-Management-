global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

storage:
  tsdb:
    retention:
      time: 15d

scrape_configs:
  - job_name: station-platform-app
    static_configs:
      - targets: [app:9464]

  - job_name: prometheus
    static_configs:
      - targets: [127.0.0.1:9090]
